name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        python-version: ["3.12", "3.14",]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test]
      # The files of the SOHO archive never change, so the ones the tests
      # download are kept from one run to the next.
      - name: Restore the files the tests download
        uses: actions/cache@v4
        with:
          path: .soho-test-downloads
          key: soho-test-downloads-${{ runner.os }}-v1
      - name: Test with pytest
        env:
          MPLBACKEND: "agg"
          SOHO_TEST_DOWNLOADS: .soho-test-downloads
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
